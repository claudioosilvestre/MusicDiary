<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="profile-page">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">MusicDiary 🎵</a>
            <div class="navbar-nav">
                <a class="nav-link" href="search.html">Search</a>
                <a class="nav-link" href="favorites.html">Favorites</a>
                <a class="nav-link" href="profile.html">Profile</a>
                <button class="btn btn-outline-light ms-2" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>
    
    <div class="profile-container">
    <div class="register-container">
        <div class="search-hero text-center mb-5">
            <h1 class="hero-title">Profile</h1>
        </div>
            
        <div class="register-card">
            <label for="fistName">First Name: </label>
            <input class="form-control mb-3" type="text" id="firstName" name="firstName">

                <label for="lastName">Last Name: </label>
                <input class="form-control mb-3" type="text" id="lastName" name="lastName">

                <label for="birthDate">Birth Date: </label>
                <input class="form-control mb-3" type="date" id="birthDate" name="birthDate">

                <label for="email">Email: </label>
                <input class="form-control mb-3" type="email" id="email" name="email">
                
                <span id="error-credentials" style="display: none;">
                    We were unable to edit profile. Please check your details.
                </span>
            
                <span id="success-message" style="display: none; color: green">
                    Profile changed successfully!
                </span>
                
                <button id="edit-button" class="editBtn">Edit</button>
                <button id="deleteAccountbutton" class="delAccBtn">Delete Account</button>
            </div>
        </div>
    </div>
    
<script src="profile.js"></script>

<canvas id="constellation"></canvas>
<script>
const canvas = document.getElementById('constellation');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const stars = [];
const starCount = 80;

for(let i = 0; i < starCount; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2 + 1,
        speedX: (Math.random() - 0.5) * 0.3,
        speedY: (Math.random() - 0.5) * 0.3,
        opacity: Math.random() * 0.5 + 0.3
    });
}

function drawStars() {
    stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(108, 99, 255, ${star.opacity})`;
        ctx.fill();
    });
}

function drawLines() {
    stars.forEach((star, i) => {
        stars.slice(i + 1).forEach(other => {
            const dist = Math.hypot(star.x - other.x, star.y - other.y);
            if(dist < 120) {
                ctx.beginPath();
                ctx.moveTo(star.x, star.y);
                ctx.lineTo(other.x, other.y);
                ctx.strokeStyle = `rgba(108, 99, 255, ${0.15 * (1 - dist/120)})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }
        });
    });
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(star => {
        star.x += star.speedX;
        star.y += star.speedY;
        if(star.x < 0 || star.x > canvas.width) star.speedX *= -1;
        if(star.y < 0 || star.y > canvas.height) star.speedY *= -1;
    });
    drawLines();
    drawStars();
    requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
</body>
</html>
