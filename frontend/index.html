<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicDiary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="login-page">
    <div class="login-container">
        <h1 class="app-title">MusicDiary 🎵</h1>
        <div class="login-card">
            <h2 class="login-title">Welcome back</h2>
            <input type="text" id="username" class="form-control mb-3" placeholder="Email">
            <input type="password" id="password" class="form-control mb-3" placeholder="Password">
            <span id="error-credentials" style="display: none;">
                Invalid username or password. Please try again.
            </span>
            <button id="login" class="btn-login">Login</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
