<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="register-page">
    <canvas id="particles"></canvas>
    <div class="register-container">
        <h1 class="register-title">Register Account</h1>
        
        <div class="register-card">
        <label for="fistName">First Name: </label>
        <input class="form-control mb-3" type="text" id="firstName" name="firstName">

        <label for="lastName">Last Name: </label>
        <input class="form-control mb-3" type="text" id="lastName" name="lastName">

        <label for="birthDate">Birth Date: </label>
        <input class="form-control mb-3" type="date" id="birthDate" name="birthDate">

        <label for="email">Email: </label>
        <input class="form-control mb-3" type="email" id="email" name="email">

        <label for="password">Password: </label>
        <input class="form-control mb-3" type="password" id="password" name="password">

        <span id="error-credentials" style="display: none;">
                We were unable to create the account. Please check your details.
            </span>
            
            <span id="success-message" style="display: none; color: green">
                Account created successfully!
            </span>

        <button id="register-button" class="registerBtn">Register</button>
        <button id="cancel-button" class="cancelBtn">Cancel</button>
    </div>
</div>
<script src="register.js"></script>
<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const particles = [];
const notes = ['♪', '♫', '♬', '♩'];

for(let i = 0; i < 40; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 20 + 10,
        speed: Math.random() * 0.5 + 0.2,
        note: notes[Math.floor(Math.random() * notes.length)],
        opacity: Math.random() * 0.3 + 0.1
    });
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
        ctx.font = `${p.size}px Arial`;
        ctx.fillStyle = `rgba(108, 99, 255, ${p.opacity})`;
        ctx.fillText(p.note, p.x, p.y);
        p.y -= p.speed;
        if(p.y < -30) {
            p.y = canvas.height + 30;
            p.x = Math.random() * canvas.width;
        }
    });
    requestAnimationFrame(animate);
}
animate();


</script>
</body>
</html>
