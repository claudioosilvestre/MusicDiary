<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicDiary - Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">MusicDiary</a>
            <div class="navbar-nav">
                <a class="nav-link" href="search.html">Search</a>
                <a class="nav-link" href="favorites.html">Favorites</a>
                <button class="btn btn-outline-light ms-2" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="mb-4">MusicDiary 🎵</h1>
        <input type="text" id="searchInput" class="form-control" placeholder="Search artists or tracks...">
        <select id="searchType" class="form-select mt-2">
            <option value="artists">Artists</option>
            <option value="tracks">Tracks</option>
        </select>
        <button id="searchButton" class="btn btn-primary mt-2">Search</button>
        <div id="results" class="row mt-4"></div>
    </div>
    <script src="search.js"></script>
</body>
</html>
