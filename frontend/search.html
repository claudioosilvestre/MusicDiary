<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicDiary - Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="main-page">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">MusicDiary 🎵</a>
            <div class="navbar-nav">
                <a class="nav-link" href="search.html">Search</a>
                <a class="nav-link" href="favorites.html">Favorites</a>
                <button class="btn btn-outline-light ms-2" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>
    
    <div class="container mt-5">
        <div class="search-hero text-center mb-5">
            <h1 class="hero-title">Discover Your Next Favorite Song 🎵</h1>
            <p class="hero-subtitle">Search millions of artists and tracks</p>
        </div>
        <div class="search-bar-container">
            <input type="text" id="searchInput" class="form-control search-input" placeholder="Search artists or tracks...">
            <select id="searchType" class="form-select mt-2">
                <option value="artists">Artists</option>
                <option value="tracks">Tracks</option>
            </select>
            <button id="searchButton" class="btn btn-primary mt-2 w-100">Search</button>
        </div>
        <div id="results" class="row mt-4"></div>
    </div>
    
    <div class="modal fade" id="modalNote" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add to Favorites</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="noteInput" class="form-control search-input" placeholder="Write a note...">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" id="saveNote-btn" data-bs-dismiss="modal">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="search.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <canvas id="equalizer"></canvas>

<script>

const canvas = document.getElementById('equalizer');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const bars = [];
const barCount = 60;

for(let i = 0; i < barCount; i++) {
    bars.push({
        x: (canvas.width / barCount) * i,
        height: Math.random() * 100 + 20,
        speed: Math.random() * 2 + 1,
        direction: 1
    });
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bars.forEach((bar, i) => {
        bar.height += bar.speed * bar.direction;
        if(bar.height > 120 || bar.height < 20) bar.direction *= -1;
        
        const gradient = ctx.createLinearGradient(0, canvas.height, 0, canvas.height - bar.height);
        gradient.addColorStop(0, 'rgba(108, 99, 255, 0.6)');
        gradient.addColorStop(1, 'rgba(108, 99, 255, 0.05)');
        
        ctx.fillStyle = gradient;
        ctx.fillRect(bar.x, canvas.height - bar.height, (canvas.width / barCount) - 2, bar.height);
    });
    requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

function openModal() {
    
    const noteModalElement = document.getElementById('modalNote');
    
    const modalNote = new bootstrap.Modal(noteModalElement);
    
    modalNote.show();
}
    
</script>
</body>
</html>
